# Local infrastructure: docker compose --profile infrastructure up -d postgres qdrant
services:
  postgres:
    image: postgres:16-alpine
    profiles: [infrastructure]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
      POSTGRES_DB: ${POSTGRES_DB:-researchforge}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]

  qdrant:
    image: qdrant/qdrant:v1.17.1
    profiles: [infrastructure]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
    mem_limit: 512m
    cpus: 1.0
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
  qdrant_data:
